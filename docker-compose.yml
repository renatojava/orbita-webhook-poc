# 3 pods of the same image behind a load balancer, sharing one Postgres.
# They coordinate only through the database, as they would in Kubernetes.
x-app: &app
  # Built once by the migrate service; the pods reuse it.
  image: orbita-webhook-poc:local
  pull_policy: never
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: &app-env
    DATABASE_URL: jdbc:postgresql://postgres:5432/orbita
    DATABASE_POOL_SIZE: "20"
    # Development-only value, used so the demo can sign its requests.
    WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-dev-only-secret}
    # Migrations run once in the migrate service, never in the pods (see README).
    SPRING_FLYWAY_ENABLED: "false"
    # Short leases so the crash demo does not wait 30 s for recovery.
    ORBITA_INBOUND_LEASE: 5s
    ORBITA_OUTBOUND_LEASE: 5s
    # Shorter than the default so the demo does not wait 5 s per scenario.
    ORBITA_REPLY_WINDOW_QUIET_PERIOD: 2s
    ORBITA_REPLY_WINDOW_MAX_WAIT: 6s
  restart: "no"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orbita
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: orbita
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbita -d orbita"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Kubernetes equivalent: a Job or initContainer that runs before the rollout.
  migrate:
    build: .
    image: orbita-webhook-poc:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/orbita
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-dev-only-secret}
    command: ["--spring.main.web-application-type=none", "--orbita.workers.enabled=false"]

  app1:
    <<: *app
    environment:
      <<: *app-env
      ORBITA_INSTANCE_ID: app1
  app2:
    <<: *app
    environment:
      <<: *app-env
      ORBITA_INSTANCE_ID: app2
  app3:
    <<: *app
    environment:
      <<: *app-env
      ORBITA_INSTANCE_ID: app3

  lb:
    image: nginx:1.29-alpine
    depends_on: [app1, app2, app3]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ORBITA_PORT:-8080}:8080"

volumes:
  pgdata:
