# Plays the role of the Kubernetes Service / ALB in front of the pods.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream orbita {
    zone orbita 64k;
    # resolve: follows a pod that comes back with a new IP after being killed.
    server app1:8080 resolve max_fails=1 fail_timeout=3s;
    server app2:8080 resolve max_fails=1 fail_timeout=3s;
    server app3:8080 resolve max_fails=1 fail_timeout=3s;
}

server {
    listen 8080;
    location / {
        proxy_pass http://orbita;
        proxy_connect_timeout 1s;
        # A request that never reached a pod goes to the next one. One that did is not repeated:
        # if that pod died mid-request, Meta's resend covers it.
        proxy_next_upstream error timeout;
    }
}
