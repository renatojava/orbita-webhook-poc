spring:
  application:
    name: orbita-webhook-poc
  lifecycle:
    # On SIGTERM (rolling deploy, scale-in): stop taking work and let in-flight sends finish.
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 20s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orbita}
    username: ${DATABASE_USER:orbita}
    password: ${DATABASE_PASSWORD:orbita}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:30}
      connection-timeout: 2000
  flyway:
    locations: classpath:db/migration

server:
  shutdown: graceful

orbita:
  instance-id: ${HOSTNAME:local}
  # Empty when the variable is missing, so OrbitaProperties refuses to start.
  # Without the ":" Spring would keep the literal "${WHATSAPP_APP_SECRET}" as the secret: anyone reading this
  # file could sign valid webhooks.
  app-secret: ${WHATSAPP_APP_SECRET:}
  inbound:
    poll-interval: 100ms
    batch-size: 50
    lease: 30s
    max-attempts: 5
    backoff-base: 1s
    backoff-max: 5m
  outbound:
    poll-interval: 100ms
    batch-size: 100
    lease: 30s
    max-attempts: 5
    backoff-base: 1s
    backoff-max: 5m
  gateway:
    latency: 50ms
  reply-window:
    poll-interval: 200ms
    # Assumption to validate with real conversations: how long people pause between messages.
    quiet-period: 5s
    max-wait: 20s
